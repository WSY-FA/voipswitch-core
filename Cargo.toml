[workspace]
members = [
    "crates/voipswitch-core",
    "crates/voipswitchd",
    "crates/vs_cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
aya = "0.13"
argon2 = "0.5"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
rustyline = "14"
sea-orm = { version = "1", features = ["sqlx-sqlite", "sqlx-mysql", "runtime-tokio-rustls", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
crc32fast = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
